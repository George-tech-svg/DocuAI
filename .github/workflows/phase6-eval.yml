name: Phase 6 grounded answer evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/app/services/**'
      - 'backend/evals/**'
      - 'backend/tests/test_language_trust.py'
      - '.github/workflows/phase6-eval.yml'
  push:
    paths:
      - 'backend/app/services/**'
      - 'backend/evals/**'
      - 'backend/tests/test_language_trust.py'
      - '.github/workflows/phase6-eval.yml'

jobs:
  check-evaluation-secret:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check whether model evaluation is configured
        id: check
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  answer-evaluation:
    needs: check-evaluation-secret
    if: needs.check-evaluation-secret.outputs.configured == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run bilingual grounded answer evaluation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EVAL_MIN_CITATION: '0.90'
          EVAL_MIN_REFUSAL: '0.90'
          EVAL_MAX_P95_MS: '45000'
        run: python -m evals.run_eval

  evaluation-not-configured:
    needs: check-evaluation-secret
    if: needs.check-evaluation-secret.outputs.configured != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain why the model evaluation was skipped
        run: echo "Model evaluation skipped. Add DEEPSEEK_API_KEY as a repository or organization Actions secret to enable it."


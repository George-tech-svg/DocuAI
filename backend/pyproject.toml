[project]
name = "documind-ai-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.9,<3",
  "email-validator>=2.2,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "fastembed>=0.9,<1",
  "httpx>=0.27,<1",
  "cloudinary>=1.41,<2",
]

[tool.vercel.scripts]
build = "python scripts/preload_embedding_model.py"
